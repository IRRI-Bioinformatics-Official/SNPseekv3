<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <style type="text/css"><![CDATA[
      .box { fill:#f8f9fb; stroke:#244; stroke-width:1.6px; rx:6; ry:6 }
      .title { font: 600 14px/1.1 'Segoe UI', Arial, sans-serif; fill:#122 }
      .text { font: 12px/1.1 'Segoe UI', Arial, sans-serif; fill:#122 }
      .muted { fill:#555; font-size:11px }
      .arrow { stroke:#333; stroke-width:1.4; fill:none; marker-end:url(#arrow) }
    ]]></style>
  </defs>

  <!-- HTTP client -->
  <rect x="40" y="30" width="220" height="56" class="box"/>
  <text x="150" y="58" text-anchor="middle" class="title">HTTP Client</text>
  <text x="150" y="74" text-anchor="middle" class="muted">GET /genotype/gettable?organismId=9...</text>

  <!-- GenotypeWS -->
  <rect x="320" y="20" width="300" height="80" class="box"/>
  <text x="470" y="44" text-anchor="middle" class="title">GenotypeWS.getVariantByVarietyId()</text>
  <text x="470" y="62" text-anchor="middle" class="text">validates params &amp; builds GenotypeQueryParams</text>

  <!-- Arrow HTTP -> GenotypeWS -->
  <path d="M 260 58 L 320 58" class="arrow" />

  <!-- getVariantTable box -->
  <rect x="320" y="120" width="300" height="100" class="box"/>
  <text x="470" y="146" text-anchor="middle" class="title">getVariantTable(...)</text>
  <text x="470" y="164" text-anchor="middle" class="text">creates sVS,sVar, sRun &amp; GenotypeQueryParams</text>

  <!-- findVGenotypeRun -->
  <rect x="660" y="120" width="340" height="70" class="box"/>
  <text x="830" y="146" text-anchor="middle" class="title">VGenotypeRunDAO.findVGenotypeRunByGenotypeRunId(2)</text>
  <text x="830" y="164" text-anchor="middle" class="muted">NamedQuery: findVGenotypeRunByGenotypeRunId</text>

  <path d="M 620 150 L 660 150" class="arrow" />

  <!-- GenotypeFacade -->
  <rect x="320" y="250" width="300" height="70" class="box"/>
  <text x="470" y="280" text-anchor="middle" class="title">GenotypeFacade.queryGenotype(params)</text>
  <text x="470" y="296" text-anchor="middle" class="text">GenotypeFacadeChadoImpl -> delegates</text>

  <path d="M 470 220 L 470 250" class="arrow" />

  <!-- VarietiesGenotypeService -->
  <rect x="320" y="350" width="300" height="110" class="box"/>
  <text x="470" y="374" text-anchor="middle" class="title">VarietiesGenotypeSNPsIndelServiceImpl</text>
  <text x="470" y="392" text-anchor="middle" class="text">queryVariantStringData(params)</text>
  <text x="470" y="409" text-anchor="middle" class="muted">validates ranges &amp; chooses Nipponbare vs Allrefs</text>

  <path d="M 470 320 L 470 350" class="arrow" />

  <!-- VariantStringService -->
  <rect x="660" y="350" width="340" height="120" class="box"/>
  <text x="830" y="378" text-anchor="middle" class="title">VariantStringService.getVariantString(params)</text>
  <text x="830" y="396" text-anchor="middle" class="text">(SNP service / Indel service)</text>
  <text x="830" y="414" text-anchor="middle" class="muted">Data fetch: HDF5 reader or DB/JPQL</text>

  <path d="M 620 388 L 660 388" class="arrow" />

  <!-- fillVariantTable -->
  <rect x="320" y="490" width="300" height="80" class="box"/>
  <text x="470" y="516" text-anchor="middle" class="title">fillVariantTable(...)</text>
  <text x="470" y="534" text-anchor="middle" class="text">formats VariantStringData -> VariantTableWS</text>

  <path d="M 470 460 L 470 490" class="arrow" />

  <!-- JSON response -->
  <rect x="40" y="540" width="220" height="56" class="box"/>
  <text x="150" y="566" text-anchor="middle" class="title">HTTP Response</text>
  <text x="150" y="582" text-anchor="middle" class="muted">200 OK, body: VariantTable JSON</text>

  <path d="M 470 530 L 260 572" class="arrow" />
  <path d="M 260 572 L 260 572" stroke="none"/>

  <!-- small legend & params -->
  <rect x="660" y="490" width="340" height="160" fill="#fff8e6" stroke="#8a6d00" rx="6" ry="6"/>
  <text x="830" y="514" text-anchor="middle" class="title">Request params (concrete)</text>
  <text x="700" y="540" class="text">organismId = 9</text>
  <text x="700" y="558" class="text">varid = all &amp; colVarIds = null (all varieties)</text>
  <text x="700" y="576" class="text">chr = "1", start = 1, end = 5000</text>
  <text x="700" y="594" class="text">snp = true, indel = false, coreonly = false</text>
  <text x="700" y="612" class="text">sVS = {"3kfiltered"}, sVar = {"3k"}, sRun = {VGenotypeRun#2}</text>

</svg>