about.title=Rice SNP-seek Database (Dev)
about.text=This Rice SNPseek Database provides Genotype, Phenotype, and Variety Information for rice (Oryza sativa L.). SNP genotyping data (called against Nipponbare reference Os-Nipponbare-Reference-IRGSP-1.0) came from 3,000 Rice Genomes Project. Phenotype and passport data for the 3,000 rice varieties came from the International Rice Genebank Collection Information System (IRGCIS). We are part of an ongoing effort by the International Rice Informatics Consortium (IRIC) to centralize rice research information and support gene-trait discovery.
